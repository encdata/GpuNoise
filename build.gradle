plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoGradle requires every run configuration to own a source set. The
// artifact-backed CI server supplies GPU Noise from its mods directory, so
// give that run an empty module instead of duplicating the main classes.
sourceSets {
    artifactServerRun {
        java.setSrcDirs([])
    }
}

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        // Keep the normal per-run directories, but allow isolated benchmark
        // launches to use a separate game directory without colliding with a
        // server that is already running in run/server.
        def configuredRunDirectory = providers.gradleProperty('gpunoiseRunDir')
                .orElse("run/${name}")
        workingDirectory project.file(configuredRunDirectory.get())

    }

    client {
        modSource project.sourceSets.main
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        // CI installs the distributable jar in the server's mods directory.
        // Do not also load the dev source module, which duplicates packages.
        if (!providers.gradleProperty('gpunoiseRunFromArtifact').isPresent()) {
            modSource project.sourceSets.main
        } else {
            modSource project.sourceSets.artifactServerRun
        }
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'gpunoise.forceCpuTerrain', System.getProperty('gpunoise.forceCpuTerrain', 'false')
        systemProperty 'gpunoise.fullBlockOutput', System.getProperty('gpunoise.fullBlockOutput', 'false')
        systemProperty 'gpunoise.profileTerrain', System.getProperty('gpunoise.profileTerrain', 'false')
        systemProperty 'gpunoise.disableChunkWriter', System.getProperty('gpunoise.disableChunkWriter', 'false')
        systemProperty 'gpunoise.terrainBatchWindowMs', System.getProperty('gpunoise.terrainBatchWindowMs', '20')
        systemProperty 'gpunoise.terrainBatchTargetChunks', System.getProperty('gpunoise.terrainBatchTargetChunks', '64')
        systemProperty 'gpunoise.fastMath', System.getProperty('gpunoise.fastMath', 'false')
        systemProperty 'gpunoise.vulkanSmoke', System.getProperty('gpunoise.vulkanSmoke', 'false')
        argument '--nogui'
        def configuredServerPort = providers.gradleProperty('gpunoiseServerPort')
        if (configuredServerPort.isPresent()) {
            arguments.addAll '--port', configuredServerPort.get()
        }
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        modSource project.sourceSets.main
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    junit {
        modSource project.sourceSets.main
    }

    data {
        modSource project.sourceSets.main
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// NeoGradle prepares the run directory as part of runServer. That setup can
// replace its mods directory after the benchmark script stages the release
// artifact. Re-stage the built jar immediately before JavaExec launches so the
// dedicated-server smoke test exercises the same distributable jar uploaded
// by CI.
tasks.named('runServer').configure {
    doFirst {
        if (providers.gradleProperty('gpunoiseRunFromArtifact').isPresent()) {
            def artifactMods = project.file(providers.gradleProperty('gpunoiseRunDir').getOrElse('run/server'))
                    .toPath().resolve('mods')
            def artifacts = fileTree('build/libs').matching { include '*-all.jar' }.files
            if (artifacts.size() != 1) {
                throw new GradleException("Expected exactly one *-all.jar for artifact-backed runServer, found ${artifacts.size()}")
            }
            java.nio.file.Files.createDirectories(artifactMods)
            java.nio.file.Files.copy(artifacts.first().toPath(), artifactMods.resolve(artifacts.first().name),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Staged GPU Noise release artifact into ${artifactMods}")
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    artifactServerRunImplementation.extendsFrom implementation
    artifactServerRunRuntimeOnly.extendsFrom runtimeOnly
    artifactServerRunCompileOnly.extendsFrom compileOnly
    lwjglNatives
    serverLwjglCore
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforged, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"
    // ASM's tree API is used by the conservative runtime density-bytecode
    // frontend. Directly declaring it avoids relying on NeoForge/Mixin's
    // transitive implementation details.
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    // The client already supplies LWJGL core. Bundle only the Vulkan bindings
    // through Jar-in-Jar; the early locator below adds LWJGL core as a game
    // library only on dedicated servers.
    jarJar(implementation("org.lwjgl:lwjgl-vulkan:${lwjgl_version}") {
        transitive = false
    }) {
        version {
            strictly "[${lwjgl_version},3.3.4)"
            prefer lwjgl_version
        }
    }
    // Compile against core and embed a plain copy for conditional server-side
    // discovery. It intentionally is not registered as a Jar-in-Jar library.
    compileOnly "org.lwjgl:lwjgl:${lwjgl_version}"
    serverLwjglCore "org.lwjgl:lwjgl:${lwjgl_version}"
    // Keep native classifiers out of Jar-in-Jar metadata and include all
    // supported platforms as resources in the published artifact.
    lwjglNatives "org.lwjgl:lwjgl:${lwjgl_version}:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl:${lwjgl_version}:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl:${lwjgl_version}:natives-macos"
    // NeoGradle 7 uses this configuration for ordinary libraries in dev runs.
    localRunRuntime "org.lwjgl:lwjgl-vulkan:${lwjgl_version}"
    localRunRuntime "org.lwjgl:lwjgl:${lwjgl_version}"
    if (System.getProperty('os.name', '').toLowerCase().contains('linux')) {
        // Dev run configurations do not use the flattened native payload in
        // the published jar, so provide LWJGL's Linux native to runServer CI.
        localRunRuntime "org.lwjgl:lwjgl:${lwjgl_version}:natives-linux"
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Store a server-only game-library jar as an opaque resource in the mod jar.
// The early IModFileCandidateLocator extracts and registers it on dedicated
// servers before normal mod discovery. FMLModType marks it as a game library.
def lwjglNativeTrees = configurations.lwjglNatives.collect { zipTree(it) }
def serverLwjglCoreJarTask = tasks.register('serverLwjglCoreJar', Jar) {
    archiveFileName = 'lwjgl-core-gpunoise-server.jar'
    from({ zipTree(configurations.serverLwjglCore.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    manifest {
        attributes('FMLModType': 'LIBRARY')
    }
}
def serverLwjglNativesJarTask = tasks.register('serverLwjglNativesJar', Jar) {
    archiveFileName = 'lwjgl-natives-gpunoise-server.jar'
    from(lwjglNativeTrees) {
        include 'windows/**', 'linux/**', 'macos/**'
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    manifest {
        attributes('FMLModType': 'LIBRARY')
    }
}
tasks.named('jar', Jar).configure {
    dependsOn serverLwjglCoreJarTask, serverLwjglNativesJarTask
    from(serverLwjglCoreJarTask.flatMap { it.archiveFile }) {
        into 'META-INF/gpunoise/server-libraries'
    }
    from(serverLwjglNativesJarTask.flatMap { it.archiveFile }) {
        into 'META-INF/gpunoise/server-libraries'
    }
}

// Include platform native resources without adding duplicate module entries
// to META-INF/jarjar/metadata.json.
tasks.named('jarJar') {
    from(lwjglNativeTrees) {
        include 'windows/**'
        include 'linux/**'
        include 'macos/**'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    dependsOn(tasks.named('compileGpuShaders'))
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Keep runtime SPIR-V synchronized with the GLSL sources. The server loads
// SPIR-V directly, so editing a .comp file without this task would silently
// leave the old shader in use.
tasks.register('compileGpuShaders') {
    notCompatibleWithConfigurationCache('Invokes the external Vulkan shader compiler.')
    def shaderDir = file('src/main/resources/assets/gpunoise/shaders')
    // Prefer an explicit Gradle property, then GLSLC, then glslc from PATH.
    // This keeps shader compilation portable across developer machines and CI.
    def compiler = providers.gradleProperty('gpunoise.glslc')
            .orElse(providers.environmentVariable('GLSLC'))
            .orElse('glslc')
            .get()
    def shaderSources = fileTree(shaderDir).matching { include '**/*.comp'; exclude 'density_graph_grid.comp' }.files
    def shaderOutputs = shaderSources.collect { file(it.path + '.spv') } + file(shaderDir.path + '/density_graph_grid.comp.spv')
    def fastGraphOutputs = [32, 64, 128, 256].collectMany { registerCount ->
        [file(shaderDir.path + "/density_graph_fast_${registerCount}.comp.spv"),
         file(shaderDir.path + "/density_graph_grid_fast_${registerCount}.comp.spv")]
    }
    inputs.files(shaderSources)
    outputs.files(shaderOutputs + fastGraphOutputs)
    doLast {
        shaderSources.eachWithIndex { source, index ->
            def output = shaderOutputs[index]
            ant.exec(executable: compiler, failonerror: true, logError: true) {
                arg(value: '-O')
                arg(value: '-I')
                arg(value: shaderDir.absolutePath)
                arg(value: '-o')
                arg(value: output.absolutePath)
                arg(value: source.absolutePath)
            }
        }
        ant.exec(executable: compiler, failonerror: true, logError: true) {
            arg(value: '-O')
            arg(value: '-DGRID_INPUT')
            arg(value: '-o')
            arg(value: shaderDir.path + '/density_graph_grid.comp.spv')
            arg(value: shaderDir.path + '/density_graph.comp')
        }
        [32, 64, 128, 256].each { registerCount ->
            ant.exec(executable: compiler, failonerror: true, logError: true) {
                arg(value: '-O')
                arg(value: "-DREGISTER_COUNT=${registerCount}")
                arg(value: '-o')
                arg(value: shaderDir.path + "/density_graph_${registerCount}.comp.spv")
                arg(value: shaderDir.path + '/density_graph.comp')
            }
            ant.exec(executable: compiler, failonerror: true, logError: true) {
                arg(value: '-O')
                arg(value: '-DGRID_INPUT')
                arg(value: "-DREGISTER_COUNT=${registerCount}")
                arg(value: '-o')
                arg(value: shaderDir.path + "/density_graph_grid_${registerCount}.comp.spv")
                arg(value: shaderDir.path + '/density_graph.comp')
            }
            ant.exec(executable: compiler, failonerror: true, logError: true) {
                arg(value: '-O')
                arg(value: '-DFAST_MATH')
                arg(value: "-DREGISTER_COUNT=${registerCount}")
                arg(value: '-o')
                arg(value: shaderDir.path + "/density_graph_fast_${registerCount}.comp.spv")
                arg(value: shaderDir.path + '/density_graph.comp')
            }
            ant.exec(executable: compiler, failonerror: true, logError: true) {
                arg(value: '-O')
                arg(value: '-DFAST_MATH')
                arg(value: '-DGRID_INPUT')
                arg(value: "-DREGISTER_COUNT=${registerCount}")
                arg(value: '-o')
                arg(value: shaderDir.path + "/density_graph_grid_fast_${registerCount}.comp.spv")
                arg(value: shaderDir.path + '/density_graph.comp')
            }
        }
    }
}

// The Vulkan smoke runs from the initialized CI server lifecycle so Minecraft
// and NeoForge registries are available to the Java bytecode fixtures.

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
