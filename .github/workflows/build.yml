name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      chunky_radius_blocks:
        description: Chunky radius in blocks
        type: string
        default: '250'
        required: true
      terrain_batch_window_ms:
        description: Maximum terrain batch collection window in milliseconds
        type: string
        default: '50'
        required: true
      terrain_batch_target_chunks:
        description: Desired chunks in each compatible GPU dispatch
        type: string
        default: '96'
        required: true
      terrain_batch_region_radius:
        description: Number of 10 by 10 chunk regions searched in each direction
        type: string
        default: '2'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Windows ModLauncher code-source paths
        run: |
          mkdir -p build/ci-path-check
          javac -d build/ci-path-check \
            src/main/java/dev/gpunoise/loader/CodeSourcePathResolver.java \
            tools/ci/CodeSourcePathResolverCheck.java
          java -cp build/ci-path-check dev.gpunoise.loader.CodeSourcePathResolverCheck

      - name: Install GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc mesa-vulkan-drivers vulkan-tools xvfb

      - name: Verify Mesa Lavapipe is available
        run: |
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) -print -quit)"
          test -n "$icd"
          echo "Using Mesa ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          export VK_ICD_FILENAMES="$icd"
          vulkaninfo --summary | tee /tmp/vulkan-summary.txt
          grep -Eqi 'llvmpipe|lavapipe' /tmp/vulkan-summary.txt

      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      - name: Verify single mod artifact
        run: python3 tools/ci/verify_mod_artifact.py build/libs/*-all.jar

      - name: Upload mod before dedicated-server checks
        uses: actions/upload-artifact@v4
        with:
          name: gpunoise-mod-${{ github.sha }}
          path: build/libs/*-all.jar
          if-no-files-found: error

      - name: Verify release jar loads in isolated client
        run: xvfb-run --auto-servernum python3 tools/ci/verify_client_artifact.py

      - name: Download and verify worldgen test mods
        run: python3 tools/ci/runserver_benchmark.py --prepare-mods

      - name: Upload worldgen test mods
        uses: actions/upload-artifact@v4
        with:
          name: gpunoise-benchmark-mods-${{ github.sha }}
          path: build/ci-mods/*.jar
          if-no-files-found: error

  worldgen:
    name: C2ME Chunky / ${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile:
          - without-terrain-mods
          - tectonic-overworld-stack
          - expanded-biome-stacks
          - biomes-weve-gone
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mesa Lavapipe and Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc mesa-vulkan-drivers vulkan-tools

      - name: Verify Mesa Lavapipe is available
        run: |
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) -print -quit)"
          test -n "$icd"
          echo "Using Mesa ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          export VK_ICD_FILENAMES="$icd"
          vulkaninfo --summary | tee /tmp/vulkan-summary.txt
          grep -Eqi 'llvmpipe|lavapipe' /tmp/vulkan-summary.txt

      - name: Download GPU Noise mod
        uses: actions/download-artifact@v4
        with:
          name: gpunoise-mod-${{ github.sha }}
          path: build/libs

      - name: Download worldgen test mods
        uses: actions/download-artifact@v4
        with:
          name: gpunoise-benchmark-mods-${{ github.sha }}
          path: build/ci-mods

      - name: Verify downloaded artifacts
        run: |
          python3 tools/ci/verify_mod_artifact.py build/libs/*-all.jar
          python3 -c 'from pathlib import Path; files=list(Path("build/ci-mods").glob("*.jar")); assert files, "worldgen mod artifact is empty"; print(f"Verified {len(files)} worldgen mod jars")'

      - name: Run CPU and GPU Chunky checks for selected profile
        env:
          GPUNOISE_CHUNKY_RADIUS_BLOCKS: ${{ inputs.chunky_radius_blocks || '250' }}
          GPUNOISE_TERRAIN_BATCH_WINDOW_MS: ${{ inputs.terrain_batch_window_ms || '50' }}
          GPUNOISE_TERRAIN_BATCH_TARGET_CHUNKS: ${{ inputs.terrain_batch_target_chunks || '96' }}
          GPUNOISE_TERRAIN_BATCH_REGION_RADIUS: ${{ inputs.terrain_batch_region_radius || '2' }}
          GPUNOISE_CI_FULL_BLOCK_OUTPUT: true
          GPUNOISE_CI_VERIFY_AQUIFER: true
        run: python3 tools/ci/runserver_benchmark.py --profile '${{ matrix.profile }}'

      - name: Upload worldgen test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpunoise-ci-results-${{ matrix.profile }}-${{ github.sha }}
          path: |
            build/reports/ci/*.log
            hs_err_pid*.log
          if-no-files-found: warn
